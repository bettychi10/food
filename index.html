<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食育融情：SEL情緒探索</title>
<style>
  :root{--bg:#FFF9F0;--card:#FFF;--ink:#3D3A36;--soft:#8A8178;--pink:#FF9EB5;--red:#E8737F;--yellow:#FFCC66;--green:#8FCB9B;--blue:#8FB8DE;--purple:#B79CD6;--line:#EFE6DA;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  #voiceToggle{position:fixed;bottom:18px;right:18px;z-index:80;display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.10);}
  #voiceToggle.on{background:var(--green);border-color:var(--green);color:#fff;}
  #voiceToggle .dot{width:10px;height:10px;border-radius:50%;background:#CFC7BC;display:inline-block;}
  #voiceToggle.on .dot{background:#fff;}
  #home{max-width:820px;margin:0 auto;padding:64px 20px 60px;text-align:center;}
  .logo{font-size:46px;line-height:1.1;margin:0 0 6px;}
  .sub{color:var(--soft);margin:0 0 36px;font-size:15px;}
  .roles{display:grid;gap:18px;grid-template-columns:1fr;max-width:640px;margin:0 auto;}
  @media(min-width:680px){.roles{grid-template-columns:repeat(2,1fr);}}
  .role{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:32px 22px;cursor:pointer;transition:.18s;box-shadow:0 4px 16px rgba(0,0,0,.04);}
  .role .roleimg{display:block;margin:0 auto 14px;width:130px;height:130px;object-fit:contain;}
  .role .emoji{font-size:56px;display:block;margin-bottom:12px;}
  .role h3{margin:0 0 6px;font-size:21px;}
  .role p{margin:0;color:var(--soft);font-size:13.5px;line-height:1.7;}
  .screen{display:none;padding:16px 16px 110px;max-width:960px;margin:0 auto;}
  .screen.active{display:block;}
  .topbar{display:flex;align-items:center;gap:12px;margin:8px 0 20px;flex-wrap:wrap;}
  .back{background:#fff;border:2px solid var(--line);border-radius:999px;padding:10px 18px;font-size:15px;cursor:pointer;font-weight:600;color:var(--ink);}
  .panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px;margin-bottom:18px;}
  .panel h3{margin:0 0 14px;font-size:17px;}
  .hint{color:var(--soft);font-size:13.5px;line-height:1.8;}
  .edge-tip{background:#F1FAF3;border:2px solid var(--green);border-radius:14px;padding:10px 14px;font-size:13px;color:#2F7D46;margin-bottom:16px;display:none;}
  .btn{background:var(--pink);color:#fff;border:none;border-radius:999px;padding:12px 26px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn.blue{background:var(--blue);}
  .btn.white{background:#fff;color:var(--ink);border:2px solid var(--line);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-family:inherit;font-size:15px;color:var(--ink);background:#FFFDF9;}
  .cards{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);}
  @media(min-width:640px){.cards{grid-template-columns:repeat(3,1fr);}}
  .qcard{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px 12px;text-align:center;cursor:pointer;}
  .qcard .qi{font-size:40px;display:block;margin-bottom:8px;}
  .qcard span.t{font-size:14px;font-weight:600;line-height:1.5;}
  .suits{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);}
  @media(min-width:640px){.suits{grid-template-columns:repeat(4,1fr);}}
  .suitcard{border-radius:20px;padding:20px 10px;cursor:pointer;color:#fff;font-weight:800;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.10);}
  .suitcard .si{font-size:40px;display:block;line-height:1;}
  .suitcard .st{font-size:15px;margin-top:8px;display:block;}
  .s-hearts{background:#FFE39B;}.s-clubs{background:#B5E6C8;}.s-diamonds{background:#BBD9F2;}.s-spades{background:#FFC9DB;}
  .s-hearts,.s-clubs,.s-diamonds,.s-spades{color:#2E2A24 !important;}
  .s-hearts .bt,.s-clubs .bt,.s-diamonds .bt,.s-spades .bt,
  .s-hearts .be,.s-clubs .be,.s-diamonds .be,.s-spades .be,
  .s-hearts .si,.s-clubs .si,.s-diamonds .si,.s-spades .si,
  .s-hearts .st,.s-clubs .st,.s-diamonds .st,.s-spades .st{color:#2E2A24 !important;font-weight:800 !important;}
  #childSuitGrid .bigbtn{border:none;border-radius:24px;box-shadow:0 4px 12px rgba(0,0,0,.12);padding:18px 10px;}
  #childFoodGrid .zp,.ingcard .zp,.popupbox .zp,#childSuitGrid .zp{color:#2E2A24 !important;}
  .suitcard .si,.suitcard .st,.bigbtn .be,.bigbtn .bt{text-shadow:0 1px 0 rgba(255,255,255,.6);}
  .bigbtn .bt,.suitcard .st{font-weight:900;}
  .foodrow{display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px;cursor:pointer;background:#fff;}
  .foodrow .num{font-size:20px;font-weight:800;color:var(--soft);min-width:34px;}
  .foodrow .fname{font-size:16px;font-weight:700;flex:1;}
  .foodrow .froman{font-size:13px;color:#8A8178;}
  .roman{font-size:19px;color:#B5566A;font-weight:700;}
  .pre{white-space:pre-line;font-size:14.5px;line-height:1.95;color:var(--ink);}
  .chat{background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px;margin-top:18px;}
  .msgs{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .msg{padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.7;max-width:85%;white-space:pre-wrap;}
  .msg.bot{background:#F4F1EC;align-self:flex-start;}
  .msg.me{background:#FFE3EA;align-self:flex-end;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{background:#F4F1EC;border:none;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink);}
  #child{background:linear-gradient(180deg,#FFF9F0 0%,#FFF1E2 100%);min-height:100vh;}
  .bigrow{display:grid;gap:16px;grid-template-columns:repeat(2,1fr);max-width:640px;margin:0 auto;}
  .bigbtn{border:3px solid #fff;border-radius:28px;padding:22px 12px;text-align:center;cursor:pointer;color:#fff;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .bigbtn .bei{width:100px;height:100px;object-fit:contain;margin-bottom:6px;}
  .bigbtn .be{font-size:60px;display:block;line-height:1;}
  .bigbtn .bt{font-size:22px;margin-top:10px;display:block;}
  .c-happy{background:var(--yellow);}.c-angry{background:var(--red);}.c-sad{background:var(--blue);}
  .c-surprise{background:var(--purple);}.c-fear{background:#9AA7B5;}.c-disgust{background:var(--green);}
  .childhead{text-align:center;margin:10px 0 22px;}
  .childhead h2{margin:0;font-size:26px;line-height:2.4;}
  .childhead p{color:var(--soft);font-size:14px;margin:6px 0 0;line-height:2.4;}
  .speakbar{text-align:center;margin-top:22px;}
  .zy{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin:0 2px;}
  .zp{writing-mode:vertical-rl;text-orientation:upright;font-size:0.42em;color:#B5566A;font-weight:400;line-height:1;margin-left:1px;}
  .bigbtn .zp{color:#fff;opacity:.92;}
  .bigbtn .bt{line-height:2.4;}
  .popupbox h3{line-height:2.2;}
  .sec p{line-height:2.4;}
  .inggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media(min-width:520px){.inggrid{grid-template-columns:repeat(4,1fr);}}
  .ingcard{background:#FFFDF9;border:2px dashed var(--line);border-radius:16px;padding:10px 6px;text-align:center;}
  .ingph{width:64px;height:64px;border-radius:12px;background:#fff;object-fit:contain;display:block;margin:0 auto 6px;}
  .ingcard .nm{font-size:14px;font-weight:700;line-height:1.4;}
  .popup{position:fixed;inset:0;background:rgba(61,58,54,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .popup.show{display:flex;}
  .popupbox{background:#fff;border-radius:28px;padding:26px 24px;max-width:600px;width:100%;text-align:left;max-height:88vh;overflow-y:auto;}
  .popupbox .pei{width:150px;height:150px;object-fit:contain;display:block;margin:0 auto 8px;}
  .popupbox .pe{font-size:56px;text-align:center;}
  .popupbox h3{margin:6px 0 14px;font-size:24px;text-align:center;}
  .sec{margin-bottom:16px;}
  .sec .lbl{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--pink);border-radius:999px;padding:3px 12px;margin-bottom:8px;}
  .sec .lbl.blue{background:var(--blue);}
  .sec .lbl.green{background:var(--green);}
  .sec p{margin:0;font-size:15px;color:var(--ink);}
  .sec ol{margin:0;padding-left:20px;font-size:15px;line-height:1.9;}
  .sec .ex{background:#FFF6F8;border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.8;color:#7A5560;}
  .sec .lv{font-size:14.5px;line-height:1.9;}
  .popactions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
  .popwrap{position:relative;width:100%;max-width:600px;}
  .xclose{position:absolute;top:-12px;right:-10px;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--soft);font-size:18px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(0,0,0,.14);z-index:5;display:flex;align-items:center;justify-content:center;line-height:1;}
  .xclose:hover{background:#FFE3EA;color:var(--ink);}
  .scorewrap{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);}
  @media(min-width:700px){.scorewrap{grid-template-columns:repeat(3,1fr);}}
  .scorecard{background:#FFFDF9;border:3px solid var(--line);border-radius:20px;padding:14px 12px;text-align:center;}
  .scorecard .sname{width:100%;text-align:center;font-size:16px;font-weight:700;border:none;background:transparent;color:var(--ink);font-family:inherit;border-bottom:2px dashed var(--line);padding:4px;margin-bottom:6px;}
  .scorecard .sc{font-size:54px;font-weight:800;line-height:1;color:var(--pink);margin:8px 0 12px;}
  .scorecard .sb{display:flex;gap:8px;justify-content:center;}
  .scorecard .sb button{border:none;border-radius:14px;font-family:inherit;font-weight:800;cursor:pointer;}
  .splus{background:var(--green);color:#fff;font-size:22px;padding:12px 22px;}
  .sminus{background:#E5DED4;color:#6B6259;font-size:18px;padding:12px 16px;}
  .slead{border-color:var(--yellow);background:#FFFDF3;}
  .cscorewrap{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);max-width:640px;margin:0 auto;}
  .cscorecard{background:#fff;border:3px solid #fff;border-radius:24px;padding:16px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.06);}
  .cscorecard.lead{border-color:var(--yellow);background:#FFFDF3;}
  .cname{width:100%;text-align:center;font-size:18px;font-weight:800;border:none;background:transparent;color:var(--soft);font-family:inherit;border-bottom:2px dashed var(--line);padding:4px;margin-bottom:6px;}
  .cnum{font-size:56px;font-weight:800;color:var(--pink);line-height:1.1;margin:6px 0 12px;}
  .cplus{background:var(--green);color:#fff;border:none;border-radius:18px;font-family:inherit;font-size:22px;font-weight:800;padding:14px 8px;cursor:pointer;flex:1;}
  .cminus{background:#E5DED4;color:#6B6259;border:none;border-radius:18px;font-family:inherit;font-size:20px;font-weight:800;padding:14px 8px;cursor:pointer;flex:1;}
  .cscorecard .sb{display:flex;gap:22px;padding:0 8px;}
  .togglebtn{background:#fff;border:2px solid var(--line);border-radius:999px;padding:7px 18px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;color:var(--soft);margin-top:10px;}
  /* 注音由程式標注（不用字型） */
  .cpanel{background:#fff;border:2px solid var(--line);border-radius:24px;padding:20px 16px;margin-bottom:18px;box-shadow:0 4px 14px rgba(0,0,0,.04);}
  .cpanel .childhead{margin:4px 0 16px;}
</style>
</head>
<body>

<button id="voiceToggle" onclick="toggleVoice()"><span class="dot"></span><span id="voiceLabel">🔇 語音：關</span></button>

<div id="home">
  <h1 class="logo">🍚 食育融情<br>💛 SEL情緒探索</h1>
  <p class="sub">食物 × 情緒 × 文化</p>
  <div class="roles">
    <div class="role" onclick="go('parent')">
      <img class="roleimg" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS88KBYDlUClXbUkPwjwGQVF34vXlwSN6iK7NMd2xyCUUaZqIA&s" alt="家長端" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=&quot;emoji&quot;>👨‍👩‍👧</span>'">
      <h3>家長端</h3><p>使用說明書<br>玩法規則<br>問答小幫手</p>
    </div>
    <div class="role" onclick="go('child')">
      <img class="roleimg" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhDgkDCMZIyX94Y5xngKSDGoraNNlI7bJCO6sFRccNFxC0DL5cDSuCLceRu8p1iulbf7uxEkhmQIh6IY0tZWkCLPA-5CN_Yx8F_JARMAH48qVClk53vNUc7Qo6qIYGbHd0d8EsHRO4MUSXO/s1600/dance_youchien.png" alt="幼兒端" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=&quot;emoji&quot;>🧸</span>'"><h3>幼兒端</h3><p>點圖片、聽聲音<br>認識情緒小人<br>不用打字</p>
    </div>
  </div>
  <p class="hint" style="margin-top:34px;">右上角可開啟語音朗讀 🔊</p>
</div>

<div id="parent" class="screen">
  <div class="topbar"><button class="back" onclick="go('home')">← 回首頁</button><h2 style="margin:0;font-size:22px;">👨‍👩‍👧 家長端</h2></div>
  <div class="edge-tip" id="edgeTip">💡 偵測到你在用 Edge，語音會使用台灣腔！</div>
  <div class="panel"><h3>🍚 食物卡</h3><p class="hint" style="margin-bottom:16px;">點選花色 → 點食物，即可看到「材料」與「做法」。</p><div class="suits" id="suitCards"></div></div>
  <div class="panel"><h3>🎲 玩法</h3><p class="hint" style="margin-bottom:16px;">點選玩法，查看完整規則<span id="voiceHintText"></span>。</p><div class="cards" id="gameCards"></div></div>
  <div class="panel"><h3>🃏 翻翻樂計分板</h3><p class="hint" style="margin-bottom:14px;">先選幾個人玩，就會出現對應數量的計分板。</p>
    <div class="row" id="playerPick">
      <button class="btn white" onclick="startScore(1)">1 人</button>
      <button class="btn white" onclick="startScore(2)">2 人</button>
      <button class="btn white" onclick="startScore(3)">3 人</button>
      <button class="btn white" onclick="startScore(4)">4 人</button>
      <input type="number" id="customPlayers" min="1" max="30" value="8" style="width:88px;text-align:center;padding:11px;border:2px solid var(--line);border-radius:999px;font-family:inherit;font-size:15px;">
      <span style="font-weight:700;color:var(--soft);">人</span>
      <button class="btn" onclick="startScoreCustom()">自訂人數</button>
    </div>
    <div id="scoreBoard" style="margin-top:16px;"></div>
  </div>
  <div class="panel"><h3>❓ 常見問題</h3><div class="cards" id="faqCards"></div></div>
  <div class="panel"><h3>💬 問答小幫手</h3>
    <div class="chat"><div class="msgs" id="msgs"></div>
      <div class="chips">
        <button class="chip" onclick="ask('翻翻樂幾個人可以玩')">翻翻樂幾個人？</button>
        <button class="chip" onclick="ask('食材卡怎麼玩')">食材卡怎麼玩？</button>
        <button class="chip" onclick="ask('適合幾歲？')">適合幾歲？</button>
        <button class="chip" onclick="ask('肉粽怎麼做')">肉粽怎麼做？</button>
      </div>
      <div class="row"><input type="text" id="chatInput" placeholder="輸入你的問題…" onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">送出</button></div>
    </div>
  </div>
</div>

<div id="child" class="screen">
  <div class="topbar"><button class="back" onclick="go('home')">← 回首頁</button></div>
  <div class="cpanel">
    <div class="childhead"><h2 id="childTitle"></h2><p id="childSub"></p></div>
    <div class="bigrow" id="emotionGrid"></div>
    <div class="speakbar"><button class="btn blue" id="childAgain" onclick="replay()"></button></div>
  </div>
  <div class="cpanel">
    <div class="childhead"><h2 id="childFoodTitle"></h2></div>
    <div class="bigrow" id="childSuitGrid" style="max-width:520px;"></div>
    <div style="text-align:center;margin:14px 0;">
      <button class="togglebtn" id="foodToggle" onclick="toggleBox('food')">▲ 收起來</button>
    </div>
    <div id="foodBody">
      <div class="bigrow" id="childFoodGrid" style="display:none;"></div>
    </div>
  </div>
  <div class="cpanel">
    <div class="childhead"><h2 id="childScoreTitle"></h2></div>
    <div class="row" style="justify-content:center;margin-bottom:16px;">
      <button class="btn white" onclick="startScore(1)">1 人</button>
      <button class="btn white" onclick="startScore(2)">2 人</button>
      <button class="btn white" onclick="startScore(3)">3 人</button>
      <button class="btn white" onclick="startScore(4)">4 人</button>
      <input type="number" id="customPlayers2" min="1" max="30" value="8" style="width:88px;text-align:center;padding:11px;border:2px solid var(--line);border-radius:999px;font-family:inherit;font-size:15px;">
      <span style="font-weight:700;color:var(--soft);">人</span>
      <button class="btn" onclick="startScoreCustom(true)">自訂人數</button>
    </div>
    <div style="text-align:center;margin:0 0 14px;">
      <button class="togglebtn" id="scoreToggle" onclick="toggleBox('score')">▲ 收起來</button>
    </div>
    <div id="scoreBody">
      <div id="childScoreBoard"></div>
    </div>
  </div>
</div>

<div class="popup" id="popup"><div class="popwrap"><div class="popupbox" id="popupbox"></div><button class="xclose" onclick="closePopup()">✕</button></div></div>

<script>
/* ===== 語音 ===== */
let voiceOn=false;
let lastSpeech='',lastAudio='',curAudio=null;
function stopAudio(){
  try{ if(curAudio){curAudio.pause();curAudio.currentTime=0;} }catch(e){}
  curAudio=null;
  if('speechSynthesis' in window)speechSynthesis.cancel();
}
function toggleVoice(){
  voiceOn=!voiceOn;
  document.getElementById('voiceToggle').classList.toggle('on',voiceOn);
  document.getElementById('voiceLabel').textContent=voiceOn?'🔊 語音：開':'🔇 語音：關';
  const el=document.getElementById('voiceHintText'); if(el)el.textContent=voiceOn?'，並自動朗讀':'';
  if(voiceOn)speakPage('語音已開啟。'); else stopAudio();
}
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('zh'));
  if(!vs.length)return null;
  const score=v=>{let s=0,n=(v.name+' '+v.voiceURI).toLowerCase(),l=v.lang.toLowerCase();
    if(l==='zh-tw'||l==='zh_tw')s+=100;if(/hsiaochen|hsiaoyu|yunjhe|曉臻|曉雨|雲哲/.test(n))s+=300;if(/microsoft/.test(n))s+=60;return s;};
  return vs.sort((a,b)=>score(b)-score(a))[0];
}
function buildUtter(t){const u=new SpeechSynthesisUtterance(t);const v=pickVoice();if(v)u.voice=v;u.lang=v?v.lang:'zh-TW';u.rate=0.92;u.pitch=1.10;return u;}
function ttsOnly(t){ if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); speechSynthesis.speak(buildUtter(t)); }
function speak(t){ if(!voiceOn)return; if(!('speechSynthesis' in window))return; stopAudio(); ttsOnly(t); }
function speakPage(t){
  if(!('speechSynthesis' in window))return;
  if(!voiceOn){voiceOn=true;document.getElementById('voiceToggle').classList.add('on');document.getElementById('voiceLabel').textContent='🔊 語音：開';
    const el=document.getElementById('voiceHintText'); if(el)el.textContent='，並自動朗讀';}
  stopAudio(); ttsOnly(t);
}
function audioPath(key){return AUDIO[key]||('音檔/'+key+'.mp3');}
/* 音檔一律讀本地：音檔/食物_<食物名>.m4a（或 .mp3） */
const FAUDIO={};
function playFoodAudio(key,i){
  stopAudio();
  const name=FOODS[key].items[i].food.replace(/（.*/,'');

4. 大蒜搗成蒜泥
5. 大火將高湯煮滾
6. 加入麵線，轉小火燉煮
7. 加入滷好的豬大腸一起熬煮
8. 太白粉加水調成勾芡水
9. 轉大火，勾芡水緩緩淋入並快速攪拌至濃稠
10. 盛碗淋上蒜泥
11. 點綴香菜`},
  {n:5,food:"白糖粿",roman:"pe̍h-thn̂g-kóe",ing:`糯米粉、白砂糖、水、食用油、花生糖粉`,
   how:`1. 糯米粉＋白砂糖＋水搓揉到光滑
2. 分成一小顆一小顆
3. 搓成長條扁扁的
4. 把麵團扭結
5. 下油鍋（中小火）炸
6. 要翻面，炸到金黃色
7. 起鍋
8. 稍微放涼，沾花生糖粉`},
  {n:6,food:"潤餅",roman:"lūn-piánn",ing:`潤餅皮、豬肉絲、豆干、蛋皮、高麗菜、豆芽菜、紅蘿蔔、花生粉、香菜`,
   how:`1. 高麗菜絲、紅蘿蔔絲與豆芽菜分別下鍋炒熟，炒乾或瀝乾水分
2. 雞蛋煎成蛋皮
3. 將高麗菜、紅蘿蔔、蛋皮、豆干、豬肉切成絲
4. 潤餅皮攤開鋪在盤上，放入配菜
5. 撒上花生粉及香菜
6. 上下左右向中間折，包住所有食材`},
  {n:7,food:"佛跳牆",roman:"thiàu-tshiûnn",ing:`大白菜、魚皮、干貝、豬皮、排骨、鳥蛋、扁魚、金鉤蝦米、乾香菇、大骨湯、雞腳`,
   how:`1. 豬骨、雞腳、豬皮、魚皮冷水煮滾，汆燙後撈出洗淨
2. 另一鍋放入豬骨、雞腳與豬皮，煮成濃白湯，魚皮先撈出
3. 香菇與干貝泡軟，香菇去蒂切塊
4. 排骨與雞翅醃過裹地瓜粉，炸至金黃
5. 鳥蛋炸至虎皮狀
6. 扁魚炸酥壓碎，與蝦米、香菇炒香
7. 大白菜切塊炒軟
8. 深鍋底層鋪大白菜
9. 第二層放炸排骨、雞翅、豬皮
10. 第三層放扁魚碎、蝦米、香菇、鳥蛋
11. 最上層擺干貝與魚皮
12. 倒入白湯淹過食材，加鹽與米酒
13. 蓋鍋放入電鍋蒸至軟嫩`},
  {n:8,food:"滷肉飯",roman:"lóo-bah-pn̄g",ing:`豬絞肉、紅蔥頭、蒜頭、白飯、冰糖、醬油、米酒、白胡椒粉`,
   how:`1. 紅蔥頭與蒜頭切碎
2. 鍋中加油，紅蔥頭小火炸至金黃酥脆後撈出
3. 利用餘油爆香蒜末
4. 加入豬絞肉大火翻炒至變白、逼出油脂
5. 倒入冰糖翻炒上糖色
6. 沿鍋邊淋入醬油與米酒炒香
7. 撒白胡椒粉，倒回紅蔥酥拌勻
8. 加清水沒過肉燥，煮滾後轉小火燉至濃稠
9. 淋在白飯上，灑白胡椒`},
  {n:9,food:"虱目魚湯",roman:"sat-ba̍k-hî-thng",ing:`虱目魚、薑絲、蔥、芹菜、水、米酒、鹽、白胡椒粉`,
   how:`1. 虱目魚洗淨切塊，蔥與芹菜切細末
2. 鍋中倒水，放一半薑絲，大火煮滾
3. 放入魚塊，轉中小火（避免魚肉散掉）
4. 倒入米酒，撈去浮沫
5. 煮熟後加鹽調味
6. 起鍋前撒上薑絲、蔥花、芹菜珠與白胡椒`},
  {n:10,food:"封肉",roman:"hong-bah",ing:`五花肉、蒜頭、薑、蔥、八角、冰糖、米酒、醬油、水`,
   how:`1. 五花肉切大塊，冷水煮滾汆燙去血水，撈出洗淨瀝乾
2. 熱鍋不加油，煎五花肉至各面微金黃，逼出油脂後撈出
3. 用鍋內豬油，小火加冰糖熬成琥珀糖色
4. 五花肉倒回，快速翻炒裹上糖色
5. 放入蒜頭、薑片、蔥段、八角炒香
6. 沿鍋邊淋米酒與醬油炒香
7. 倒清水淹過肉塊，煮滾後撈去浮沫
8. 蓋鍋轉小火慢燉，至筷子可輕易戳透
9. 開蓋轉中大火收汁至濃稠油亮`}
 ]},
 clubs:{name:"梅花（客家）",icon:"♣",cls:"s-clubs",items:[
  {n:1,food:"米苔目",roman:"miˋ qiˊ mugˋ",ing:`在來米粉、水、地瓜粉、韭菜、豆芽菜、肉燥、油蔥酥、高湯`,
   how:`1. 在來米粉均分兩份（50g＋50g）
2. 在來米粉 50g 加水 160g 拌勻，中火加熱至糊化後關火
3. 加入剩餘在來米粉和地瓜粉 50g 快速攪拌，太濃可加冷水
4. 麵糊裝入擠花袋
5. 煮一鍋沸水，將麵糊擠進滾水中
6. 煮熟浮起即可撈起
7. 另盛一盆水備用
8. 高湯煮滾後加米苔目、韭菜、豆芽菜，盛碗加肉燥及油蔥酥`},
  {n:2,food:"糍粑",roman:"ci baˋ",ing:`糯米、水、花生粉、黑芝麻粉、砂糖`,
   how:`1. 糯米洗淨浸泡至飽和，瀝乾後蒸熟
2. 趁熱放入抹薄油的容器，用木棒擣打至糊化、有拉絲感
3. 花生粉、芝麻粉與砂糖混合成糖粉
4. 雙手沾熟油，把糍粑捏成圓球
5. 裹上厚厚花生芝麻糖粉`},
  {n:3,food:"九層粄",roman:"giuˋ cenˇ banˋ",ing:`在來米粉、地瓜粉、糯米粉、水、黑糖、二砂糖`,
   how:`1. 三種粉與水拌勻，過濾後平分成兩鍋
2. 一鍋加黑糖成為黑糖粉漿
3. 另一鍋加二砂糖成為二砂粉漿
4. 蒸鍋水燒開，蒸模抹薄油預熱
5. 舀一層黑糖粉漿，大火蒸至凝固變透明
6. 再舀一層二砂粉漿，蒸至凝固
7. 重複交替，直到堆疊出九層
8. 最後一層用中大火蒸至完全熟透
9. 放涼至完全冷卻後，用抹油刀切塊`},
  {n:4,food:"客家鹹豬肉",roman:"hagˋ gaˊ hamˇ zuˊ ngiugˋ",ing:`五花肉、蒜頭、黑胡椒、鹽、米酒`,
   how:`1. 五花肉洗淨擦乾，切成長條大塊
2. 蒜頭切細末，與鹽、黑胡椒混合成醃料
3. 米酒均勻塗抹五花肉每一面
4. 醃料抹上並反覆搓揉按摩
5. 放入密封袋冷藏醃 2～3 天
6. 取出後刮除多餘蒜碎
7. 烤箱或平底鍋中小火煎烤至兩面金黃
8. 放涼後切薄片`},
  {n:5,food:"粄條",roman:"banˋ tiauˇ",ing:`在來米粉、太白粉、水、韭菜、豆芽菜、肉燥、油蔥酥`,
   how:`1. 水中加鹽攪勻
2. 在來米粉、太白粉分次加入水中攪勻無粉粒
3. 模具刷一層沙拉油
4. 粉漿舀入模具搖勻，水滾後大火蒸
5. 取出趁熱刷油，沿四邊劃過方便取出
6. 韭菜切段，豆芽菜洗淨
7. 高湯煮滾，汆燙粄條、韭菜與豆芽菜後撈出
8. 淋上肉燥與油蔥酥`},
  {n:6,food:"客家炒肉",roman:"hagˋ gaˊ cauˋ ngiugˋ",ing:`豬肉、魷魚乾、豆干、芹菜、蒜頭、醬油`,
   how:`1. 乾魷魚剪成小條，泡水至軟
2. 五花肉和豆乾切小條
3. 五花肉乾煎逼出油脂
4. 放入豆乾炒到邊緣焦黃
5. 放入魷魚炒香
6. 放入蒜頭爆香
7. 加醬油調味翻炒均勻
8. 加芹菜翻炒至軟即完成`},
  {n:7,food:"擂茶",roman:"luiˇ caˇ",ing:`茶葉、燕麥、花生、芝麻、南瓜子、葵瓜子、糖、熱開水`,
   how:`1. 花生、芝麻、南瓜子、葵瓜子小火慢炒至微黃有香味
2. 茶葉磨成細粉
3. 加入燕麥片、南瓜子、葵瓜子一起研磨
4. 最後加花生（去皮）、芝麻、糖，稍微磨碎拌勻（勿磨太久）
5. 熱水溫杯，注入 200cc 熱開水
6. 倒入擂茶粉約 30g，攪拌均勻`},
  {n:8,food:"大腸炒薑絲",roman:"giongˊ xiˊ cauˋ zuˊ congˇ",ing:`豬大腸、薑絲、白醋、蔥、蒜頭、糖、水`,
   how:`1. 大腸翻洗拔油洗淨，水煮到軟爛，撈起切圈
2. 薑切絲、蒜切末
3. 熱鍋下油，先炒薑絲，再下蒜末爆香
4. 放入大腸快炒
5. 轉中火加水 2 大匙，加糖
6. 翻炒均勻讓大腸吸收調味
7. 加蔥，沿鍋邊淋白醋
8. 快火翻炒 3～5 秒，立刻出鍋`},
  {n:9,food:"客家酸菜肉片湯",roman:"hamˇ coiˋ ngiug pien tongˋ",ing:`客家酸菜、豬肉片、薑絲、蔥、高湯、鹽`,
   how:`1. 嫩薑切絲
2. 酸菜切絲
3. 油鍋爆香薑絲
4. 加入酸菜爆香
5. 加入豬肉片拌炒至約 8 分熟
6. 加高湯大火煮滾，轉中小火煮到酸菜微透明金黃即可關火`},
  {n:10,food:"牛汶水",roman:"ngiuˇ vun suiˋ",ing:`糯米粉、水、黑糖、薑汁、花生粉、芝麻`,
   how:`1. 黑糖 50g、薑汁 105g 入鍋煮滾，轉小火煮到黑糖化開
2. 糯米粉 135g 和水 95g 混合揉成團
3. 取 1/10 糯米糰捏成圓餅，放入滾水煮至浮起
4. 與原糯米糰揉勻，分成 12 份，揉圓壓扁、中間按出凹洞
5. 煮一鍋滾水，將麻糬煮至浮起
6. 放入黑糖薑汁中，灑上芝麻粉和花生碎`}
 ]},
 diamonds:{name:"菱形（新住民）",icon:"♦",cls:"s-diamonds",items:[
  {n:1,food:"越南法國麵包",roman:"Bánh mì",ing:`法國麵包 1 個
豬肝醬、豬肉、越南火腿、醃蘿蔔、香菜、生菜、魚露`,
   how:`1. 取一個法國麵包。
2. 將豬肝醬、豬肉、越南火腿、醃蘿蔔、香菜、生菜、魚露放進麵包中即可。`},
  {n:2,food:"越南河粉",roman:"Phở",ing:`牛肉、洋蔥、大蒜、糖、鹽、河粉、檸檬汁、豆芽菜、九層塔、薄荷、水`,
   how:`1. 牛肉放入冷水煮滾，去除血水雜質，再用清水洗淨。
2. 洋蔥、大蒜放入平底鍋煎到焦香。
3. 大鍋加牛肉、辛香料與水，煮滾後撈除浮沫，轉小火燉數小時。
4. 取出牛肉，湯中加冰糖與鹽調味。
5. 河粉燙熟放碗中，鋪上牛肉，撒上配料，淋上高湯即可。`},
  {n:3,food:"印尼炒飯",roman:"Nasi Goreng",ing:`紅蔥酥、參巴醬、沙嗲醬、海鮮、雞肉、蔬菜、雞蛋、白飯、鹽、蔥花`,
   how:`1. 紅蔥頭、大蒜、參巴醬與沙爹醬攪拌。
2. 熱油鍋，將海鮮、雞肉、蔬菜、雞蛋炒熟後盛出備用。
3. 同鍋補少許油轉大火，倒入白飯快速翻炒至均勻裹上醬料。
4. 加入炒熟的配料，翻炒均勻，以少許鹽調味即可起鍋。`},
  {n:4,food:"越南春捲",roman:"Gỏi cuốn",ing:`米線、蝦子、豬肉、米紙、生菜、九層塔、薄荷葉、小黃瓜、紅蘿蔔、香菜、魚露`,
   how:`1. 米線煮熟，撈出泡冰水冷卻、瀝乾。
2. 蝦子與豬肉煮熟後放涼。
3. 米紙放入水中浸泡數秒至微軟。
4. 平鋪砧板上，依序放上配料。
5. 左右往內摺，再由下往上捲成圓筒狀。
6. 沾魚露食用。`},
  {n:5,food:"涼拌青木瓜",roman:"Gỏi đu đủ",ing:`青木瓜、鹽、紅蘿蔔絲、蒜頭、辣椒、魚露、檸檬汁、椰糖、小番茄、菜豆、香菜、花生、水`,
   how:`1. 青木瓜削皮去籽，刨成細絲。
2. 加 1 匙鹽抓勻靜置軟化，用冷開水洗淨後冰鎮，瀝乾。
3. 紅蘿蔔削皮刨細絲。
4. 將水、蒜頭、辣椒、魚露、檸檬汁、椰糖、鹽調成醬汁。
5. 青木瓜絲、紅蘿蔔絲、小番茄、菜豆、香菜放入大碗，淋醬汁拌勻，撒上碎花生。`},
  {n:6,food:"炸香蕉",roman:"Pisang Goreng",ing:`香蕉
低筋麵粉、蛋黃、奶油
鹽、糖、水或牛奶
沙拉油`,
   how:`1. 香蕉剝皮，切片或條狀。
2. 低筋麵粉、蛋黃、奶油、鹽、糖放入碗中，分次加水或牛奶調成濃稠麵糊。
3. 鍋中倒沙拉油加熱至中火。
4. 香蕉裹上薄麵糊，中小火油炸至金黃酥脆。
5. 撈出放吸油紙上吸油即可。`},
  {n:7,food:"涼拌米線",roman:"Bún trộn",ing:`米線、豬肉、小黃瓜、紅蘿蔔、洋蔥、美生菜絲、豆芽菜、大蒜、辣椒、香菜、九層塔、花生、魚露、鹽、糖`,
   how:`1. 米線煮熟，撈起用冰水沖涼，瀝乾。
2. 豬肉燙熟或煎熟切片；蔬菜切絲；洋蔥絲泡冷水去辛辣；蒜、辣椒切末。
3. 蒜末、辣椒末、魚露、鹽與糖拌勻成醬汁。
4. 米線鋪盤底，依序放上配料，撒上香菜、九層塔及碎花生，淋醬汁拌勻。`},
  {n:8,food:"巴東牛肉",roman:"Rendang sapi",ing:`牛肋條
紅蔥頭、蒜頭、老薑、南薑、辣椒
香茅、肉桂、八角
薑黃粉、羅望子醬
糖、鹽、椰漿`,
   how:`1. 牛肋條切塊，冷水下鍋煮滾，撈出洗淨擦乾。
2. 辛香料切碎、香茅切段。
3. 鍋中炒香辛香料，再加入香茅、肉桂與八角拌炒。
4. 放入牛肋條拌炒裹上香料，加羅望子醬、糖與鹽調味。
5. 倒入椰漿與水，煮滾後轉小火燉至軟嫩。
6. 開蓋小火慢慢收乾醬汁至濃稠。`},
  {n:9,food:"越式烤豬排飯",roman:"Cơm tấm sườn",ing:`帶骨豬排、香茅、蒜頭、紅蔥頭、辣椒、蔥、魚露、醬油、鹽、糖、蜂蜜、白胡椒粉、五香粉、檸檬汁、大黃瓜、蘿蔔、白醋、番茄、生菜、泰國茉莉香米、雞蛋`,
   how:`1. 豬排洗淨擦乾，用肉錘敲打。
2. 辛香料切碎，加入調味料拌成醃料。
3. 豬排抹上醃料，冷藏醃至少 4 小時。
4. 蔬菜切絲或切片，加白醋、糖與鹽醃製。
5. 香米洗淨煮熟。
6. 豬排中小火煎至兩面金黃熟透。
7. 煎荷包蛋。
8. 香米盛盤，放上豬排、荷包蛋與配菜擺盤。`},
  {n:10,food:"薑黃飯",roman:"Nasi kuning",ing:`印度長米
洋蔥、紅蔥頭、大蒜、香茅
薑黃粉、黑胡椒、月桂葉
雞高湯、椰奶
鹽、糖`,
   how:`1. 印度長米洗淨瀝乾。

function go(w){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('home').style.display='none';
  if(w==='home'){document.getElementById('home').style.display='block';return;}
  document.getElementById(w).classList.add('active');
  if(w==='parent')renderParent(); if(w==='child')renderChild();
  window.scrollTo(0,0);
}
function renderParent(){
  document.getElementById('suitCards').innerHTML=Object.keys(FOODS).map(k=>`<div class="suitcard ${FOODS[k].cls}" onclick="openSuit('${k}')"><span class="si">${FOODS[k].icon}</span><span class="st">${FOODS[k].name}</span></div>`).join('');
  document.getElementById('gameCards').innerHTML=GAMES.map((g,i)=>`<div class="qcard" onclick="openGame(${i})"><span class="qi">${g.icon}</span><span class="t">${g.title}</span></div>`).join('');
  document.getElementById('faqCards').innerHTML=FAQS.map((f,i)=>`<div class="qcard" onclick="openFaq(${i})"><span class="qi">${f.icon}</span><span class="t">${f.title}</span></div>`).join('');
  if(/Edg\//.test(navigator.userAgent))document.getElementById('edgeTip').style.display='block';
  if(!document.getElementById('msgs').children.length)botMsg('您好！我是食食小幫手 👋 想了解教具怎麼用，都可以問我喔！');
}
function speakText(t){lastSpeech=t;lastAudio='';speak(t);}
function openSuit(key){
  const s=FOODS[key];
  let h=`<div class="pe">${s.icon}</div><h3>${s.name}</h3>`;
  s.items.forEach((it,i)=>{h+=`<div class="foodrow" onclick="openFood('${key}',${i})"><span class="num">${it.n}</span><span class="fname">${it.food}<br><span class="froman">${it.roman}</span></span></div>`;});
  h+=`<div class="popactions"><button class="btn" onclick="closePopup()">關閉</button></div>`;
  document.getElementById('popupbox').innerHTML=h;document.getElementById('popup').classList.add('show');
  speakText(s.name+'，共十種食物。');
}
function openFood(key,i){
  const s=FOODS[key];const it=s.items[i];
  document.getElementById('popupbox').innerHTML=`<div class="pe">${s.icon}</div><h3>${it.food}</h3>
    <img src="${foodImgPath(key,i)}" alt="${it.food}" style="width:100%;max-width:190px;border-radius:16px;display:block;margin:0 auto 14px;" onerror="this.style.display='none'">
    <div class="sec"><span class="lbl">花色 / 數字</span><p>${s.name.replace(/（.*）/,'')}　${it.n}</p></div>
    <div class="sec"><span class="lbl">發音</span><p class="roman">${it.roman}</p></div>
    <div class="sec"><span class="lbl blue">📋 材料</span><div class="pre">${it.ing}</div></div>
    <div class="sec"><span class="lbl green">🍳 做法</span><div class="pre">${it.how}</div></div>
    <div class="popactions"><button class="btn white" onclick="openSuit('${key}')">← 返回列表</button><button class="btn" onclick="closePopup()">關閉</button></div>`;
  document.getElementById('popup').classList.add('show');lastSpeech=it.food+'。';lastAudio='';
}
function openGame(i){
  const g=GAMES[i];
  if(g.sub){
    let h=`<div class="pe">${g.icon}</div><h3>${g.title}</h3><p class="hint" style="text-align:center;margin-bottom:14px;">請選擇一種玩法</p>`;
    g.sub.forEach((s,j)=>{h+=`<div class="foodrow" onclick="openSub(${i},${j})"><span class="fname">${s.icon} ${s.title}</span></div>`;});
    h+=`<div class="popactions"><button class="btn" onclick="closePopup()">關閉</button></div>`;
    document.getElementById('popupbox').innerHTML=h;document.getElementById('popup').classList.add('show');
    speakText(g.title+'。請選擇一種玩法：'+g.sub.map(s=>s.title).join('、'));
  } else showDetail(g,null);
}
function openSub(i,j){showDetail(GAMES[i].sub[j],i);}
function showDetail(g,backIdx){
  let h=`<div class="pe">${g.icon}</div><h3>${g.title}</h3>`;
  g.sections.forEach(s=>{
    h+=`<div class="sec"><span class="lbl">${s.label}</span>`;
    if(s.type==='p')h+=`<p>${s.text.replace(/\n/g,'<br>')}</p>`;
    else if(s.type==='ol')h+=`<ol>${s.items.map(x=>`<li>${x}</li>`).join('')}</ol>`;
    else if(s.type==='ex')h+=`<div class="ex">${s.text}</div>`;
    else if(s.type==='lv')h+=`<div class="lv">${s.items.map(x=>'• '+x).join('<br>')}</div>`;
    h+=`</div>`;
  });
  h+=`<div class="popactions">`;
  if(backIdx!==null)h+=`<button class="btn white" onclick="openGame(${backIdx})">← 返回食材卡</button>`;
  h+=`<button class="btn blue" onclick="replay()">🔊 再聽一次</button><button class="btn" onclick="closePopup()">好，我懂了 👍</button></div>`;
  document.getElementById('popupbox').innerHTML=h;document.getElementById('popup').classList.add('show');
  let str=g.title+'。';
  g.sections.forEach(s=>{str+=s.label.replace(/[^\u4e00-\u9fa5]/g,'')+'。';str+=(s.items?s.items.join('。'):s.text)+'。';});
  lastSpeech=str;lastAudio='';speak(str);
}
function openFaq(i){
  const f=FAQS[i];
  document.getElementById('popupbox').innerHTML=`<div class="pe">${f.icon}</div><h3>${f.title}</h3><div class="sec"><p>${f.text}</p></div>
    <div class="popactions"><button class="btn blue" onclick="replay()">🔊 再聽一次</button><button class="btn" onclick="closePopup()">好，我懂了 👍</button></div>`;
  document.getElementById('popup').classList.add('show');lastSpeech=f.title+'。'+f.text;lastAudio='';speak(lastSpeech);
}
function closePopup(){ stopAudio(); document.getElementById('popup').classList.remove('show'); }

function findFood(n){for(const k in FOODS){for(const it of FOODS[k].items){if(n&&it.food.includes(n))return it;}}return null;}
function ask(q){
  meMsg(q);
  setTimeout(()=>{
    let a='這個問題我比較不熟，建議直接問老師喔～我主要回答這套教具的相關問題 😊';
    const s=q.replace(/\s/g,'');
    const hit=findFood(s.replace(/怎麼做|做法|食譜|材料|食材|怎麼煮|作法/g,''));
    if(hit) a=hit.food+'的作法：\n'+hit.how+'\n\n📋 材料：\n'+hit.ing;
    else if(/翻翻樂/.test(s)){
      const g=GAMES[0];
      const steps=g.sections.find(x=>x.type==='ol').items.join('');
      const people=g.sections.find(x=>x.label.includes('人數')).text;
      const levels=g.sections.find(x=>x.label.includes('難度')).items.join('');
      if(/幾個人|多少人|幾人|人數|幾位|一個人|一人/.test(s)) a='翻翻樂'+people;

      else a='翻翻樂：'+steps+'。'+people;
    }
    else if(/nfc|點讀|感應/i.test(s)){a='NFC 點讀：'+GAMES[1].sections.filter(x=>x.type==='ol').map(x=>x.items.join('')).join('');}
    else if(/食物卡|撲克|花色/.test(s)) a='食物卡共有四種花色：愛心（閩南）、梅花（客家）、菱形（新住民）、黑桃（原住民），每種花色 1–10 各是一個食物。';
    else if(/食材卡/.test(s)){
      const txt='食材卡有四種玩法，點下面的按鈕看完整規則：';
      botMsg(txt); speak(txt);
      botChips([
        {t:'🍲 食物食材配對', f:function(){openSub(2,0);}},
        {t:'🤔 猜猜我可以做成什麼食物？', f:function(){openSub(2,1);}},
        {t:'🔍 食材大搜查', f:function(){openSub(2,2);}},
        {t:'🧠 食材記憶王', f:function(){openSub(2,3);}}
      ]);
      return;
    }
    else if(/骰子/.test(s)) a='情緒小人骰子的玩法：\n1. 用一句話搭配骰子，骰到什麼情緒，就用那個情緒說出那句話。\n2. 搭配故事書，遇到某個情節時骰出不同情緒，讓幼兒演繹，並發想後續不一樣的故事走向。';
    else if(/情緒小人/.test(s)) a='情緒小人立牌的玩法：\n1. 用立牌讓幼兒認識六大情緒（快樂、憤怒、悲傷、驚訝、恐懼、厭惡），並與生活故事連結。\n2. 搭配食物撲克牌與味覺籌碼，讓幼兒說出「這個食物的味道（酸甜苦辣鹹）→ 再說出吃到這個食物時我的情緒」。\n簡單版：先認識 1～3 個情緒。\n困難版：認識六大情緒，或與食物卡、味覺籌碼並用。';
    else if(/教材|內容物|有哪些東西|包含什麼/.test(s)) a='這套教具包含：\n1. 味覺籌碼（酸甜苦辣鹹）\n2. 中文撲克牌\n3. 多語言撲克牌\n4. 情緒小人骰子\n5. 情緒小人立牌（快樂、憤怒、悲傷、驚訝、恐懼、厭惡）\n6. 食材卡';
    else if(/注音|ㄅㄆㄇ/.test(s)) a='幼兒端的文字都有加上注音喔，方便孩子自己念。';
    else if(/幾歲|年齡|多大|年紀/.test(s)) a=FAQS[0].text;
    else if(/生氣|哭|不想玩|鬧|情緒|安撫/.test(s)) a='先陪著他，不急著講道理。可以說「我知道你很生氣」，並請他指指哪個情緒小人像現在的他。';
    else if(/sel|情緒學習/i.test(s)) a='SEL 是社會情緒學習，幫助孩子認識自己與他人的情緒，學會表達、同理與調節，是這套教具的核心目標。';
    else if(/食物|為什麼用食物|吃/.test(s)) a=FAQS[1].text;
    else if(/族群|原住民|客家|新住民|閩南|文化/.test(s)) a=FAQS[2].text;
    else if(/多久|時間|幾分鐘/.test(s)) a='2–3 歲約 5–10 分鐘；4–6 歲約 15–20 分鐘。孩子沒興趣就休息，不要硬撐。';
    else if(/不識字|識字|認字/.test(s)) a=FAQS[3].text;
    botMsg(a);speak(a);
  },420);
}

function splitIng(s){
  const out=[];let cur='',dep=0;
  for(const ch of s){
    if(ch==='（'||ch==='(')dep++;
    else if(ch==='）'||ch===')')dep--;
    if(ch==='、'&&dep===0){out.push(cur);cur='';}else cur+=ch;
  }
  if(cur.trim())out.push(cur);
  return out.map(x=>x.trim()).filter(Boolean);
}
function ingGrid(key,i){
  const s=KIDING[key+'-'+(i+1)]||'';
  const names=splitIng(s);
  if(!names.length)return '<p>（待補）</p>';
  return '<div class="inggrid">'+names.map(n=>{
    const file=n.replace(/[（(][^）)]*[）)]/g,'').trim();
    const u=INGIMG[key+'-'+(i+1)+'|'+file]||INGIMG[file]||('圖片/食材/'+file+'.png');
    return '<div class="ingcard"><img class="ingph" src="'+u+'" alt="'+n+'" onerror="this.style.visibility=\'hidden\'"><div class="nm">'+ruby(n)+'</div></div>';
  }).join('')+'</div>';
}
function toggleBox(which){
  const body=document.getElementById(which==='food'?'foodBody':'scoreBody');
  const btn=document.getElementById(which==='food'?'foodToggle':'scoreToggle');
  const isHidden=(body.style.display==='none');
  body.style.display=isHidden?'block':'none';
  btn.innerHTML=isHidden?'▲ '+ruby('收起來'):'▼ '+ruby('打開');
}
let scores=[];
function startScore(n){
  if(n>30) n=30; if(n<1) n=1;
  scores=[]; for(let i=0;i<n;i++) scores.push({name:'玩家'+(i+1),score:0});
  renderScore(); speakPage(n+'人玩，開始計分！');
}
function startScoreCustom(isChild){
  const el=document.getElementById(isChild?'customPlayers2':'customPlayers');
  let n=parseInt(el?el.value:'',10);
  if(!n||n<1) n=1; if(n>30) n=30;
  if(el) el.value=n;
  startScore(n);
}
function renderScore(){
  const max=scores.length?Math.max.apply(null,scores.map(s=>s.score)):0;
  const cel=document.getElementById('childScoreBoard');
  if(cel){
    if(!scores.length) cel.innerHTML='';
    else cel.innerHTML='<div class="cscorewrap">'+scores.map((s,i)=>
      '<div class="cscorecard'+(s.score>0&&s.score===max?' lead':'')+'">'
      +'<input class="cname" value="'+s.name+'" onchange="scores['+i+'].name=this.value">'
      +'<div class="cnum">'+s.score+'</div>'
      +'<div class="sb"><button class="cplus" onclick="addScore('+i+',1)">＋1</button>'
      +'<button class="cminus" onclick="addScore('+i+',-1)">－1</button></div></div>').join('')+'</div>'
      +'<div class="row" style="margin-top:14px;justify-content:center;">'
      +'<button class="btn white" onclick="resetScore()">🔄 重新開始</button></div>';
  }
  const el=document.getElementById('scoreBoard');
  if(!el) return;
  if(!scores.length){el.innerHTML='';return;}
  el.innerHTML='<div class="scorewrap">'+scores.map((s,i)=>
    '<div class="scorecard'+(s.score>0&&s.score===max?' slead':'')+'">'
    +'<input class="sname" value="'+s.name+'" onchange="scores['+i+'].name=this.value">'
    +'<div class="sc">'+s.score+'</div>'
    +'<div class="sb"><button class="splus" onclick="addScore('+i+',1)">＋1</button>'
    +'<button class="sminus" onclick="addScore('+i+',-1)">－1</button></div></div>').join('')+'</div>'
    +'<div class="row" style="margin-top:14px;justify-content:center;">'
    +'<button class="btn white" onclick="resetScore()">🔄 全部歸零</button>'
    +'<button class="btn white" onclick="clearScore()">關閉計分板</button></div>';
}
function addScore(i,d){ scores[i].score+=d; if(scores[i].score<0)scores[i].score=0; renderScore(); }
function resetScore(){ scores.forEach(s=>s.score=0); renderScore(); }
function clearScore(){ scores=[]; renderScore(); }
function foodLabel(it){
  const m=it.food.match(/^(.+?)（(.+?)）$/);
  if(m) return ruby(m[1])+'<br><span style="font-size:0.8em;opacity:.9;">（'+ruby(m[2])+'）</span>';
  return ruby(it.food);
}
function renderChild(){
  document.getElementById('childTitle').innerHTML=ruby('你今天的心情是什麼呢？');
  document.getElementById('childSub').innerHTML=ruby('點一點，聽一聽')+' 🎵';
  document.getElementById('childAgain').innerHTML='🔊 '+ruby('再聽一次');
  document.getElementById('emotionGrid').innerHTML=EMOTIONS.map(e=>`<div class="bigbtn ${e.c}" onclick="childTap('${e.key}')"><img class="bei" src="${e.img}" alt="${e.name}" onerror="this.outerHTML='<span class=&quot;be&quot;>${e.emoji}</span>'"><span class="bt">${ruby(e.name)}</span></div>`).join('');
  document.getElementById('childFoodTitle').innerHTML=ruby('這是什麼食物呢？');
  const st=document.getElementById('childScoreTitle'); if(st) st.innerHTML=ruby('誰得分最多？');
  const ft=document.getElementById('foodToggle'); if(ft) ft.innerHTML='▲ '+ruby('收起來');
  const sc=document.getElementById('scoreToggle'); if(sc) sc.innerHTML='▲ '+ruby('收起來');
  document.getElementById('childSuitGrid').innerHTML=Object.keys(FOODS).map(k=>`<div class="bigbtn ${FOODS[k].cls}" onclick="childSuit('${k}')"><span class="be">${FOODS[k].icon}</span><span class="bt" style="font-size:19px;">${ruby(FOODS[k].name)}</span></div>`).join('');
  document.getElementById('childFoodGrid').style.display='none';
}
function childSuit(key){
  const s=FOODS[key];const g=document.getElementById('childFoodGrid');
  g.style.display='grid';
  g.innerHTML=s.items.map((it,i)=>`<div class="bigbtn ${s.cls}" onclick="childFood('${key}',${i})"><span class="bt" style="font-size:18px;margin-top:0;text-align:center;line-height:2.1;">${it.n}. ${foodLabel(it)}</span></div>`).join('');
  g.scrollIntoView({behavior:'smooth',block:'center'});
}
function childFood(key,i){
  const s=FOODS[key];const it=s.items[i];
  document.getElementById('popupbox').innerHTML=`<div class="pe">${s.icon}</div><h3>${it.food}</h3>
    <img src="${foodImgPath(key,i)}" alt="${it.food}" style="width:100%;max-width:180px;border-radius:16px;display:block;margin:0 auto 14px;" onerror="this.style.display='none'">
    <div class="sec"><span class="lbl">發音</span><p class="roman">${it.roman}</p></div>
    <div class="sec"><span class="lbl blue">🧺 食材</span>${ingGrid(key,i)}</div>
    <div class="popactions"><button class="btn blue" onclick="replay()">🔊 再聽一次</button><button class="btn" onclick="closePopup()">好，我懂了 👍</button></div>`;
  document.getElementById('popup').classList.add('show');
  sayFile('食物_'+it.food.replace(/[（(].*$/,''),it.food+'。食材有'+splitIng(KIDING[key+'-'+(i+1)]||'').join('、'));
}
function childTap(key){
  const e=EMOTIONS.find(x=>x.key===key);
  document.getElementById('popupbox').innerHTML=`<img class="pei" src="${e.img}" alt="${e.name}" onerror="this.outerHTML='<div class=&quot;pe&quot;>${e.emoji}</div>'"><h3>${ruby(e.name)}</h3>
    <div class="sec"><p>${ruby(e.tip)}<br>${ruby(e.q)}</p></div>
    <div class="popactions"><button class="btn blue" onclick="replay()">🔊 ${ruby('再聽一次')}</button><button class="btn" onclick="closePopup()">${ruby('好，我懂了')} 👍</button></div>`;
  document.getElementById('popup').classList.add('show');
  sayFile('情緒_'+e.name,e.name+'。'+e.tip+e.q);
}

/* 全站統一：蔥花→蔥、沙拉油→油 */
(function(){
 const F=s=>typeof s==='string'?s.replace(/蔥花/g,'蔥').replace(/沙拉油/g,'油'):s;
 if(INGIMG['diamonds-3|蔥花'])INGIMG['diamonds-3|蔥']=INGIMG['diamonds-3|蔥花'];
 if(INGIMG['diamonds-6|沙拉油'])INGIMG['diamonds-6|油']=INGIMG['diamonds-6|沙拉油'];
 Object.keys(FOODS).forEach(k=>FOODS[k].items.forEach(it=>{it.ing=F(it.ing);it.how=F(it.how);}));
 Object.keys(KIDING).forEach(k=>{KIDING[k]=F(KIDING[k]);});
 GAMES.forEach(g=>{[g].concat(g.sub||[]).forEach(x=>(x.sections||[]).forEach(s=>{if(s.text)s.text=F(s.text);if(s.items)s.items=s.items.map(F);}));});
})();
